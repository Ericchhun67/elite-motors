{% extends "base.html" %}





{% block content %}

<div class="content-container">
    <h1 class="contact-title">Lets Find Your Dream Car</h1>
    <p class="contact-description">Reach out to us and find your perfect car today.</p>
    <div class="contact-form">
        <!-- Contact form elements go here -->
        <form action="/contact" method="post">
            <label for="first_name">First Name</label>
            <input id="first_name" class="first_name_contact" type="text" name="first_name" maxlength="50" required>
            <label for="last_name">Last Name</label>
            <input id="last_name" class="last_name_contact" type="text" name="last_name" maxlength="50" required>
            <label for="email">Email</label>
            <input id="email" class="email_contact" type="email" name="email" maxlength="100" required>
            <label for="phone_number">Phone Number</label>
            <input id="phone_number" class="phone_number_contact" type="tel" name="phone_number" maxlength="15" required>
            <label for="message">Message</label>
            <textarea id="message" class="message_contact" name="message" maxlength="1000" required></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>
    <style>
        .contact-form {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 300px;
        }

        .contact-form input.first_name_contact,
        .contact-form input.last_name_contact,
        .contact-form input.email_contact,
        .contact-form input.phone_number_contact,
        .contact-form textarea.message_contact {
            border: 1px solid #ccc;
            padding: 4px;
            margin-bottom: 10px;
            width: 200px;
        }
    </style>
</div>

<div class="addtional-info">
    <h2>Additional Information</h2>
    <p>feel free to reach out to us with any questions or inquiries about our cars.</p>
    
</div>









{% endblock %}
